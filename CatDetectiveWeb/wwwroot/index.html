<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dikkie Detective - Playtest</title>
    <script>
        // itch.io embeds the game in an iframe where screen.orientation.lock
        // rejects; patch it to swallow the rejection KNI triggers.
        if (window.screen && !window.screen.orientation) {
            window.screen.orientation = {};
        }
        if (window.screen && window.screen.orientation) {
            var originalLock = window.screen.orientation.lock;
            window.screen.orientation.lock = function (orientation) {
                if (originalLock) {
                    var promise = originalLock.call(window.screen.orientation, orientation);
                    if (promise && promise.catch) {
                        return promise.catch(function (err) {
                            console.warn("Ignored screen.orientation.lock error (expected in iframe).", err.message);
                        });
                    }
                    return promise;
                }
                return Promise.resolve();
            };
        }
    </script>
    <base href="./" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>

    <!-- Blazor mounts App.razor here; the game canvas is rendered by Index.razor -->
    <div id="app"></div>

    <!-- Boot overlay. Lives OUTSIDE #app (Blazor replaces #app's children on
         mount) and stays up until the game has drawn its first frame
         (gameLoaderHide, called from Game1.Draw). -->
    <div id="boot-overlay">
        <div id="boot-stage">
            <img id="boot-room" src="Content/Shared/menu_room.jpg" alt="" onload="this.classList.add('ready')" />
            <img id="boot-cat"  src="Content/Shared/menu_cat.webp" alt="" onload="this.classList.add('ready')" />
            <img id="boot-logo" src="Content/Shared/menu_logo.webp" alt="Dikkie Detective" onload="this.classList.add('ready')" />
            <div id="blazor-loader">
                <div id="blazor-loader-label">Waking up Dikkie...</div>
                <div id="blazor-loader-bar-bg">
                    <div id="blazor-loader-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Texture streaming: starts downloading + decoding the game art right
         away, in parallel with the .NET runtime (js/gametex*.js). -->
    <script src="js/gametex.js"></script>
    <script src="js/bootinfo.js" onerror="window.BOOT_TOTAL_BYTES = 0"></script>

    <!-- Brotli decoder for compressed .xnb content: KNI's XHR bridge
         (nkXHR.DecompressBrotliStream) decompresses on the JS side, straight
         into the WASM heap. Without this global, every compressed content
         load throws. -->
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
    </script>

    <!--
        nkast.Wasm JS interop bridges. Version suffix must match the resolved
        nkast.Wasm.* NuGet versions exactly, and they must load BEFORE
        blazor.webassembly.js.
    -->
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.8.0.11.js"></script>

    <script>
        // Music via HTMLAudioElement - bypasses the XNA Song pipeline entirely.
        // Called from CatDetective.Systems.BrowserAudio via JS interop.
        var _gAudio = {};
        window.gameAudioPlay = function (id, url, loop, volume) {
            var existing = _gAudio[id];
            if (existing) { existing.pause(); }
            var a = new Audio(url);
            a.loop = loop;
            a.volume = Math.max(0, Math.min(1, volume));
            a.play().catch(function (e) { console.warn('[Audio] play failed (' + id + '):', e.message); });
            _gAudio[id] = a;
        };
        window.gameAudioStop = function (id) {
            var a = _gAudio[id];
            if (a) { a.pause(); a.currentTime = 0; }
        };
        window.gameAudioVolume = function (id, volume) {
            var a = _gAudio[id];
            if (a) a.volume = Math.max(0, Math.min(1, volume));
        };
    </script>

    <script>
        // Called once by Blazor (Index.razor.cs OnAfterRender) with a .NET
        // object reference; starts the requestAnimationFrame-driven game loop.
        window.initRenderJS = (instance) => {
            console.log('[CatDetective] initRenderJS called - starting game loop');
            window.theInstance = instance;

            var canvas = document.getElementById('theCanvas');

            // The canvas always fills the window/iframe; the game letterboxes
            // its virtual canvas into it (WasmScale). The backing store uses the
            // device pixel ratio (capped at 2x for phone fill-rate) - at 1x a
            // phone would get a ~844 px canvas that the browser then blows up
            // 3x, which is what made mobile look grainy/soft. Pointer events
            // stay in CSS px; WasmScale.ToGame multiplies by gamePixelRatio.
            function resizeCanvas() {
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var w = Math.max(1, Math.round(window.innerWidth * dpr));
                var h = Math.max(1, Math.round(window.innerHeight * dpr));
                if (canvas.width !== w) canvas.width = w;
                if (canvas.height !== h) canvas.height = h;
                window.gamePixelRatio = w / Math.max(1, window.innerWidth);
            }
            window.gameGetPixelRatio = () => window.gamePixelRatio || 1;
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            canvas.addEventListener("contextmenu", e => e.preventDefault());

            // Keep the itch.io page from scrolling on game keys.
            window.addEventListener("keydown", function (e) {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].indexOf(e.key) > -1)
                    e.preventDefault();
            }, false);

            window.requestAnimationFrame(tickJS);
        };

        var _tickLogged = false;
        var tickJS = function () {
            // Schedule the next frame FIRST so the loop survives anything the
            // tick below does (first-frame load work killed the chain otherwise).
            window.requestAnimationFrame(tickJS);
            if (!_tickLogged) {
                console.log('[CatDetective] game loop started');
                _tickLogged = true;
            }
            try {
                window.theInstance.invokeMethod('TickDotNet');
            } catch (err) {
                console.error('[CatDetective] TickDotNet error:', err);
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // Manual boot. Phase 1 (bar 0-80%): the .NET runtime - fetched as
        // pre-gzipped .gz files (tools/build_web_assets.py) and inflated by the
        // browser's native DecompressionStream; itch.io serves files without
        // compression, so this cuts the download from ~27 MB to ~10 MB.
        // Phase 2 (80-100%): the texture worker decoding the menu art. The
        // overlay stays until the game draws its first frame (gameLoaderHide).
        (function () {
            var loadedBytes = 0, seenBytes = 0, phase = 1, shown = 0;
            var fill = document.getElementById('blazor-loader-bar-fill');
            var label = document.getElementById('blazor-loader-label');

            function setBar(pct, text) {
                shown = Math.max(shown, Math.min(100, pct));       // never runs backwards
                if (fill) fill.style.width = shown.toFixed(1) + '%';
                if (label) label.textContent = text;
            }
            function downloadProgress() {
                var total = Math.max(window.BOOT_TOTAL_BYTES || 0, seenBytes, 1);
                var f = Math.min(1, loadedBytes / total);
                setBar(f * 80, 'Fetching the casebook... ' + Math.round(f * 100) + '%');
            }

            var GZ = /\.(wasm|dat|dll)$/;
            var canInflate = typeof DecompressionStream !== 'undefined';

            function fetchCounted(url) {
                return fetch(url).then(function (response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status + ' ' + url);
                    var len = parseInt(response.headers.get('Content-Length') || '0', 10);
                    if (len > 0) seenBytes += len;
                    var reader = response.body.getReader();
                    var chunks = [];
                    function pump() {
                        return reader.read().then(function (r) {
                            if (r.done) return new Blob(chunks);
                            chunks.push(r.value);
                            loadedBytes += r.value.byteLength;
                            downloadProgress();
                            return pump();
                        });
                    }
                    return pump();
                });
            }

            function inflateIfGzip(blob) {
                // The CDN may already have decoded it (Content-Encoding: gzip):
                // only inflate when the bytes still start with the gzip magic.
                return blob.slice(0, 2).arrayBuffer().then(function (head) {
                    var h = new Uint8Array(head);
                    if (h.length < 2 || h[0] !== 0x1f || h[1] !== 0x8b) return blob;
                    return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
                });
            }

            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    if (type === 'dotnetjs') return defaultUri;
                    var mime = /\.wasm$/.test(name) ? 'application/wasm'
                             : /\.json$/.test(name) ? 'application/json' : 'application/octet-stream';
                    var p = (canInflate && GZ.test(name))
                        ? fetchCounted(defaultUri + '.gz').then(inflateIfGzip, function () { return fetchCounted(defaultUri); })
                        : fetchCounted(defaultUri);
                    return p.then(function (blob) {
                        return new Response(blob, { headers: { 'Content-Type': mime } });
                    });
                }
            }).then(function () {
                phase = 2;
                // Phase 2: the game boots as soon as its menu art is decoded.
                var timer = setInterval(function () {
                    if (phase !== 2) { clearInterval(timer); return; }
                    var tex = window.gameTex;
                    var rc = tex && tex.state() === 'active' ? tex.readyCount('Shared/').split(',') : null;
                    var f = rc && +rc[1] > 0 ? (+rc[0]) / (+rc[1]) : 1;
                    setBar(80 + 20 * f, 'Dusting off the clues...');
                }, 150);
            }, function (err) {
                setBar(shown, 'Could not start the game: ' + err);
            });

            window.gameLoaderHide = function () {
                phase = 3;
                var o = document.getElementById('boot-overlay');
                if (o) o.style.display = 'none';
            };
        })();
    </script>
</body>
</html>
